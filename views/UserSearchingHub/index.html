<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>BountyHub - Explore Bounties</title>
    <link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect" />
    <link as="style" href="https://fonts.googleapis.com/css2?display=swap&amp;family=Inter:wght@400;500;700;900"
        onload="this.rel='stylesheet'" rel="stylesheet" />
    <link href="data:image/x-icon;base64," rel="icon" type="image/x-icon" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#1173d4",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        display: ["Inter"],
                    },
                    borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px" },
                },
            },
        };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>

<body class="bg-background-light dark:bg-background-dark font-display text-gray-800 dark:text-gray-200">
    <div class="relative flex h-auto min-h-screen w-full flex-col">
        <header
            class="sticky top-0 z-10 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-sm border-b border-gray-200 dark:border-gray-800">
            <div class="container mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex h-16 items-center justify-between">
                    <div class="flex items-center gap-8">
                        <a class="flex items-center gap-2 text-gray-900 dark:text-white" href="#">
                            <span class="material-symbols-outlined text-primary text-3xl"> stars </span>
                            <h1 class="text-xl font-bold">BountyHub</h1>
                        </a>
                        <nav class="hidden md:flex items-center gap-6">
                            <a class="text-sm font-medium text-gray-600 dark:text-gray-300 hover:text-primary dark:hover:text-primary transition-colors"
                                href="#">Explore</a>
                            <a class="text-sm font-medium text-gray-600 dark:text-gray-300 hover:text-primary dark:hover:text-primary transition-colors"
                                href="#">Create</a>
                            <a class="text-sm font-medium text-gray-600 dark:text-gray-300 hover:text-primary dark:hover:text-primary transition-colors"
                                href="#">Profile</a>
                        </nav>
                    </div>
                    <div class="flex items-center gap-4">
                        <div class="hidden sm:flex relative">
                            <span
                                class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 dark:text-gray-500">
                                search </span>
                            <input
                                class="form-input w-48 rounded-lg border-gray-300 dark:border-gray-700 bg-background-light dark:bg-gray-900/50 pl-10 focus:ring-primary focus:border-primary"
                                placeholder="Search" type="search" />
                        </div>
                        <button
                            class="md:hidden p-2 rounded-full text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-800">
                            <span class="material-symbols-outlined"> menu </span>
                        </button>
                        <div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-10"
                            style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuCfJ0Sdy87tJp4xjEMorab1zyYu1SY9Gku_1TcsvJ6c6bWTzjEQ1z8wfSzJQJO26r2KmQRFgrXx3Xp72h2pyR6tG3LL7l73Sfvg58j0V9QPuX_mPj79QalTGQiAx6N8rUkp1oZx1A-kbGellTQKHqCj__D7YMC6ly35-bx_Nv4RRdI-jQa8lgoT4XvwyD2qaOHQxG_er0bST6l9UjTL7MjjNbGCUJ19tTofATtOoRkW_VCHUAC0ucZ8zps31AhVsheQDPabdcuHQP1Q");'>
                        </div>
                    </div>
                </div>
            </div>
        </header>
        <main class="container mx-auto flex-1 px-4 sm:px-6 lg:px-8 py-8">
            <div class="max-w-4xl mx-auto">
                <div class="mb-8">
                    <h1 class="text-4xl font-bold text-gray-900 dark:text-white mb-4">Explore Bounties</h1>
                    <div class="relative">
                        <span
                            class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 dark:text-gray-500">
                            search </span>
                        <input id="searchInput"
                            class="form-input w-full rounded-lg border-gray-300 dark:border-gray-700 bg-background-light dark:bg-gray-900/50 h-14 pl-12 pr-4 text-base focus:ring-2 focus:ring-primary focus:border-primary"
                            placeholder="Search for bounties by keyword, language, or project" value="" />
                    </div>
                </div>
                <div class="flex flex-wrap gap-2 mb-8">
                    <button
                        class="flex items-center gap-1 rounded-full px-4 py-2 text-sm font-medium bg-gray-200 dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-gray-300 dark:hover:bg-gray-700 transition-colors">
                        <span>Category</span>
                        <span class="material-symbols-outlined text-base"> expand_more </span>
                    </button>
                    <button
                        class="flex items-center gap-1 rounded-full px-4 py-2 text-sm font-medium bg-gray-200 dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-gray-300 dark:hover:bg-gray-700 transition-colors">
                        <span>Difficulty</span>
                        <span class="material-symbols-outlined text-base"> expand_more </span>
                    </button>
                    <button
                        class="flex items-center gap-1 rounded-full px-4 py-2 text-sm font-medium bg-gray-200 dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-gray-300 dark:hover:bg-gray-700 transition-colors">
                        <span>Status</span>
                        <span class="material-symbols-outlined text-base"> expand_more </span>
                    </button>
                    <button
                        class="flex items-center gap-1 rounded-full px-4 py-2 text-sm font-medium bg-gray-200 dark:bg-gray-800 text-gray-700 dark:text-gray-300 hover:bg-gray-300 dark:hover:bg-gray-700 transition-colors">
                        <span>Reward</span>
                        <span class="material-symbols-outlined text-base"> expand_more </span>
                    </button>
                </div>
                <div id="bountyList" class="space-y-6"></div>



                <nav id="pagination" aria-label="Pagination" class="flex items-center justify-center pt-8"></nav>



            </div>
        </main>
    </div>
    <script>
        // ======= 설정 =======
        const API_BASE = "/api";
        const PAGE_SIZE = 10;

        // ======= 간단한 해시 라우터 =======
        const routes = [
            { pattern: /^#\/?(\?.*)?$/, handler: renderExplore },           // #/  또는 #
            { pattern: /^#\/bounty\/(\d+)$/, handler: (_, id) => renderDetail(Number(id)) },
            { pattern: /^#\/create$/, handler: renderCreate },
            { pattern: /^#\/profile$/, handler: renderProfile },
        ];

        window.addEventListener("hashchange", onRouteChange);
        window.addEventListener("DOMContentLoaded", () => {
            wireSearch();
            onRouteChange();
        });

        function onRouteChange() {
            const hash = location.hash || "#/";
            for (const r of routes) {
                const m = hash.match(r.pattern);
                if (m) return r.handler(...m);
            }
            // fallback
            renderNotFound();
        }

        // ======= Explore(목록) =======
        async function renderExplore() {
            const root = document.querySelector("main .max-w-4xl") || document;
            const listEl = document.getElementById("bountyList");
            const pagerEl = document.getElementById("pagination");
            if (!listEl || !pagerEl) return;

            const url = new URL(location.href);
            const qParam = (url.hash.split("?")[1] || "").split("&").find(v => v.startsWith("q="));
            const pageParam = (url.hash.split("?")[1] || "").split("&").find(v => v.startsWith("page="));
            const q = qParam ? decodeURIComponent(qParam.split("=")[1]) : "";
            const page = pageParam ? Number(pageParam.split("=")[1]) : 1;

            // 로딩 표시
            listEl.innerHTML = `<div class="text-center text-sm text-gray-500 dark:text-gray-400">Loading...</div>`;
            pagerEl.innerHTML = "";

            try {
                const res = await fetch(`${API_BASE}/programs?q=${encodeURIComponent(q)}&page=${page}&pageSize=${PAGE_SIZE}`);
                if (!res.ok) throw new Error("Failed to load");
                const data = await res.json(); // { items: [...], total: N }
                listEl.innerHTML = data.items.map(cardHTML).join("") || emptyHTML(q);

                // 페이지네이션
                const totalPages = Math.max(1, Math.ceil((data.total || 0) / PAGE_SIZE));
                pagerEl.innerHTML = paginationHTML(page, totalPages, q);

                // 카드 버튼 라우팅
                listEl.querySelectorAll("[data-view]").forEach(btn => {
                    btn.addEventListener("click", e => {
                        const id = e.currentTarget.getAttribute("data-view");
                        location.hash = `#/bounty/${id}`;
                    });
                });
            } catch (e) {
                listEl.innerHTML = `<div class="text-center text-sm text-red-500">목록을 불러오지 못했습니다.</div>`;
            }
        }

        // ======= Detail(상세) =======
        async function renderDetail(id) {
            const root = document.querySelector(".max-w-4xl") || document.querySelector("main");
            const listEl = document.getElementById("bountyList");
            const pagerEl = document.getElementById("pagination");
            if (listEl) listEl.innerHTML = "";
            if (pagerEl) pagerEl.innerHTML = "";

            const mount = document.createElement("div");
            root.appendChild(mount);
            mount.innerHTML = `<div class="text-center text-sm text-gray-500 dark:text-gray-400">Loading...</div>`;
            try {
                const res = await fetch(`${API_BASE}/programs/${id}`);
                if (!res.ok) throw new Error();
                const p = await res.json(); // { program, org, scopes:[], rules:[] }
                mount.innerHTML = detailHTML(p);
                const backBtn = mount.querySelector("[data-back]");
                backBtn?.addEventListener("click", () => (location.hash = "#/"));
            } catch {
                mount.innerHTML = `<div class="text-center text-sm text-red-500">상세를 불러오지 못했습니다.</div>`;
            }
        }

        // ======= Placeholders =======
        function renderCreate() { document.getElementById("bountyList").innerHTML = `<div class="p-6 rounded-lg border border-dashed text-sm text-gray-500">Create 화면은 추후 구현 예정</div>`; document.getElementById("pagination").innerHTML = ""; }
        function renderProfile() { document.getElementById("bountyList").innerHTML = `<div class="p-6 rounded-lg border border-dashed text-sm text-gray-500">Profile 화면은 추후 구현 예정</div>`; document.getElementById("pagination").innerHTML = ""; }
        function renderNotFound() { document.getElementById("bountyList").innerHTML = `<div class="p-6 rounded-lg border border-dashed text-sm text-gray-500">페이지를 찾을 수 없습니다.</div>`; document.getElementById("pagination").innerHTML = ""; }

        // ======= Search 바인딩(디바운스) =======
        function wireSearch() {
            const $input = document.getElementById("searchInput");
            if (!$input) return;
            const url = new URL(location.href);
            const qParam = (url.hash.split("?")[1] || "").split("&").find(v => v.startsWith("q="));
            if (qParam) $input.value = decodeURIComponent(qParam.split("=")[1]);

            let t;
            $input.addEventListener("input", () => {
                clearTimeout(t);
                t = setTimeout(() => {
                    const q = $input.value.trim();
                    location.hash = q ? `#/?q=${encodeURIComponent(q)}` : "#/";
                }, 400);
            });
        }

        // ======= View Helpers =======
        function cardHTML(p) {
            const hero = p.hero_image || "https://picsum.photos/seed/bounty" + p.program_id + "/640/360";
            const org = escapeHTML(p.org_name || "");
            const title = escapeHTML(p.name || "");
            const desc = escapeHTML(p.description || "");
            return `
    <div class="bg-background-light dark:bg-gray-900/50 p-6 rounded-lg border border-gray-200 dark:border-gray-800 hover:border-primary dark:hover:border-primary transition-all duration-300">
      <div class="flex flex-col md:flex-row items-start gap-6">
        <div class="flex-[2_2_0px] space-y-3">
          <p class="text-sm font-medium text-primary">${org}</p>
          <h3 class="text-xl font-bold text-gray-900 dark:text-white">${title}</h3>
          <p class="text-gray-600 dark:text-gray-400 text-sm">${desc}</p>
          <button data-view="${p.program_id}" class="inline-flex items-center justify-center rounded-lg bg-primary px-5 py-2.5 text-sm font-medium text-white shadow-sm hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:ring-offset-2 focus:ring-offset-background-light dark:focus:ring-offset-background-dark">
            View Bounty
          </button>
        </div>
        <div class="w-full md:w-1/3 h-48 bg-center bg-no-repeat bg-cover rounded-lg flex-1" style="background-image:url('${hero}');"></div>
      </div>
    </div>`;
        }

        function paginationHTML(page, total, q) {
            const link = (p, label = p) =>
                `<a href="#/?page=${p}${q ? `&q=${encodeURIComponent(q)}` : ""}" class="inline-flex items-center justify-center size-9 text-sm font-medium rounded-full ${p === page ? "bg-primary text-white" : "text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-800"}">${label}</a>`;
            const prev = page > 1 ? `<a class="inline-flex items-center justify-center size-9 rounded-full text-gray-500 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-gray-800" href="#/?page=${page - 1}${q ? `&q=${encodeURIComponent(q)}` : ""}"><span class="material-symbols-outlined text-lg">chevron_left</span></a>` : "";
            const next = page < total ? `<a class="inline-flex items-center justify-center size-9 rounded-full text-gray-500 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-gray-800" href="#/?page=${page + 1}${q ? `&q=${encodeURIComponent(q)}` : ""}"><span class="material-symbols-outlined text-lg">chevron_right</span></a>` : "";
            const pages = Array.from({ length: total }, (_, i) => i + 1).slice(0, 10).map(p => link(p)).join("");
            return `${prev}${pages}${next}`;
        }

        function detailHTML(d) {
            const p = d.program;
            const org = d.org;
            const scopes = d.scopes || [];
            const rules = d.rules || [];
            return `
      <div class="space-y-6">
        <button data-back class="text-sm text-gray-500 hover:text-primary">&larr; Back to list</button>
        <div class="bg-background-light dark:bg-gray-900/50 p-6 rounded-lg border border-gray-200 dark:border-gray-800">
          <p class="text-sm font-medium text-primary">${escapeHTML(org?.org_name || "")}</p>
          <h2 class="text-2xl font-bold mb-2">${escapeHTML(p?.name || "")}</h2>
          <p class="text-gray-600 dark:text-gray-400">${escapeHTML(p?.description || "")}</p>
          <div class="mt-4 text-xs text-gray-500">Visibility: ${p?.visibility} · Public Disclosure: ${p?.allow_public_disclosure ? "Allowed" : "Restricted"}</div>
        </div>
        <div class="grid md:grid-cols-2 gap-6">
          <div class="p-6 rounded-lg border border-gray-200 dark:border-gray-800">
            <h3 class="font-semibold mb-3">In Scope</h3>
            <ul class="list-disc pl-5 space-y-1">
              ${scopes.filter(s => s.in_scope).map(s => `<li>${escapeHTML(s.scope_name)} <span class="text-xs text-gray-500">${escapeHTML(s.notes || "")}</span></li>`).join("") || "<li class='text-gray-500 text-sm'>No scope listed</li>"}
            </ul>
          </div>
          <div class="p-6 rounded-lg border border-gray-200 dark:border-gray-800">
            <h3 class="font-semibold mb-3">Rules</h3>
            <ul class="list-disc pl-5 space-y-1">
              ${rules.map(r => `<li><span class="text-xs rounded px-2 py-0.5 border mr-2">${escapeHTML(r.rule_type)}</span>${escapeHTML(r.content)}</li>`).join("") || "<li class='text-gray-500 text-sm'>No rules</li>"}
            </ul>
          </div>
        </div>
      </div>
    `;
        }

        function emptyHTML(q) {
            return `<div class="text-center text-sm text-gray-500 dark:text-gray-400">"${escapeHTML(q || "")}" 검색 결과가 없습니다.</div>`;
        }

        function escapeHTML(s) { return (s ?? "").replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])); }
    </script>

</body>

</html>
